version: 2

project_name: modelmove

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: modelmove
    main: ./cmd/modelmove
    binary: modelmove
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/shaneburrell/modelmove/internal/cli.version={{ .Version }}
      - -X github.com/shaneburrell/modelmove/internal/cli.commit={{ .Commit }}
      - -X github.com/shaneburrell/modelmove/internal/cli.date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
      - freebsd
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      - goos: freebsd
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  footer: |
    ## Installing

    Both machines need `modelmove` on their `PATH` for SSH transfers: the
    local side drives the transfer and the remote side runs `modelmove
    remote-helper`. The binaries are static, so scp'ing one across is enough.

    ```
    go install github.com/shaneburrell/modelmove/cmd/modelmove@{{ .Tag }}
    ```
